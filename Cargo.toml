[package]
name = "zlc"
version = "0.1.0"
edition = "2021"
description = "Readable, navigable Android logcat for the Zed editor (zed-logcat)"
license = "Apache-2.0"
repository = "https://github.com/himattm/zed-logcat"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
terminal_size = "0.4"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
lto = true
