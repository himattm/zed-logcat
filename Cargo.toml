[package]
name = "zlc"
version = "0.0.1"
edition = "2021"
description = "Readable, navigable Android logcat for the Zed editor (zed-logcat)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himattm/zed-logcat"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
terminal_size = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
strip = true
lto = true
